[project]
name = "passenger-forecast"
version = "0.1.0"
description = "Point-in-time-safe Munich station passenger forecasting"
requires-python = "==3.12.*"
dependencies = [
  "catboost==1.2.7",
  "lightgbm==4.6.0",
  "numpy==1.26.4",
  "optuna==4.2.0",
  "pandas==2.2.3",
  "pyarrow==23.0.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "scikit-learn==1.6.1",
  "typer==0.16.0",
]

[project.scripts]
forecast = "passenger_forecast.cli:app"

[dependency-groups]
dev = [
  "hypothesis==6.124.7",
  "mypy==1.14.1",
  "pandas-stubs==2.2.3.241126",
  "pip-audit==2.7.3",
  "pytest==9.0.3",
  "pytest-cov==6.0.0",
  "ruff==0.9.4",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passenger_forecast"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["passenger_forecast"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["passenger_forecast"]
